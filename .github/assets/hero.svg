<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="t d">
  <title id="t">Rex Agent Restore</title>
  <desc id="d">Three Rex windows. First: Claude Code, Codex and OpenCode are mid-chat in three panes. Second: the Rex server restarts and every pane comes back as an empty shell. Third: with Rex Agent Restore, each pane resumes its chat where it was.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .fg { fill: #E6EDF3; }
    .dim { fill: #7D8590; }
    .faint { fill: #484F58; }
    .claude { fill: #D97757; font-weight: 700; }
    .codex { fill: #58A6FF; font-weight: 700; }
    .oc { fill: #E3B341; font-weight: 700; }
    .ok { fill: #3FB950; }
    .bad { fill: #F85149; }
    .resume { fill: #7D8590; font-style: italic; font-size: 11.5px; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <clipPath id="c1"><rect x="30" y="110" width="380" height="380" rx="10"/></clipPath>
    <clipPath id="c2"><rect x="450" y="110" width="380" height="380" rx="10"/></clipPath>
    <clipPath id="c3"><rect x="870" y="110" width="380" height="380" rx="10"/></clipPath>
    <g id="chrome">
      <rect x="0" y="0" width="380" height="380" rx="10" fill="#161B22" stroke="#30363D"/>
      <path d="M0 10 a10 10 0 0 1 10 -10 h360 a10 10 0 0 1 10 10 v20 h-380 z" fill="#1C2128"/>
      <line x1="0" y1="30" x2="380" y2="30" stroke="#30363D"/>
      <circle cx="16" cy="15" r="5" fill="#FF5F57"/>
      <circle cx="32" cy="15" r="5" fill="#FEBC2E"/>
      <circle cx="48" cy="15" r="5" fill="#28C840"/>
      <text x="190" y="19.5" text-anchor="middle" class="sans dim" font-size="12">Rex · api</text>
      <line x1="200" y1="30" x2="200" y2="380" stroke="#30363D"/>
      <line x1="200" y1="205" x2="380" y2="205" stroke="#30363D"/>
    </g>
  </defs>

  <rect width="1280" height="600" fill="url(#bg)"/>

  <text x="640" y="50" text-anchor="middle" class="sans fg" font-size="28" font-weight="700">Restart Rex. Your agent chats come back.</text>
  <text x="640" y="80" text-anchor="middle" class="sans dim" font-size="15">Claude Code · Codex · OpenCode · Gemini CLI · Cursor · Copilot · and 11 more</text>

  <!-- 1: agents mid-chat -->
  <g transform="translate(30 110)">
    <use href="#chrome"/>
    <g class="mono">
      <text x="14" y="56" class="claude">● Claude Code</text>
      <text x="14" y="84" class="fg">&gt; refactor the auth</text>
      <text x="14" y="102" class="fg">  module</text>
      <text x="14" y="128" class="dim">● Read 12 files</text>
      <text x="14" y="148" class="dim">● Update session.ts</text>
      <text x="14" y="166"><tspan class="dim">  └ </tspan><tspan class="ok">+48</tspan><tspan class="dim"> </tspan><tspan class="bad">−31</tspan></text>
      <text x="14" y="194" class="claude" font-weight="400">✻ Thinking…</text>

      <text x="214" y="56" class="codex">› codex</text>
      <text x="214" y="84" class="fg">› add parser tests</text>
      <text x="214" y="108" class="dim">• Running pytest</text>
      <text x="214" y="128" class="ok">  ✓ 42 passed</text>

      <text x="214" y="231" class="oc">opencode</text>
      <text x="214" y="259" class="fg">Build · fix flaky</text>
      <text x="214" y="277" class="fg">  CI test</text>
      <text x="214" y="301" class="dim">▣ Editing ci.yml</text>
    </g>
  </g>

  <!-- 2: Rex restarts -->
  <g transform="translate(450 110)">
    <use href="#chrome"/>
    <g class="mono">
      <text x="14" y="56" class="dim">~/api ❯ <tspan class="fg">▌</tspan></text>
      <text x="214" y="56" class="dim">~/api ❯</text>
      <text x="214" y="231" class="dim">~/api ❯</text>
      <text x="14" y="84" class="faint">new shell</text>
      <text x="214" y="84" class="faint">new shell</text>
      <text x="214" y="259" class="faint">new shell</text>
    </g>
    <rect x="95" y="160" width="190" height="56" rx="28" fill="#0D1117" stroke="#F85149" stroke-opacity="0.6"/>
    <text x="190" y="194" text-anchor="middle" class="sans fg" font-size="17" font-weight="600">↻  Rex restarted</text>
  </g>

  <!-- 3: every chat resumes -->
  <g transform="translate(870 110)">
    <use href="#chrome"/>
    <g class="mono">
      <text x="14" y="52" class="resume">resuming claude chat</text>
      <text x="14" y="78" class="claude">● Claude Code</text>
      <text x="14" y="104" class="fg">&gt; refactor the auth</text>
      <text x="14" y="122" class="fg">  module</text>
      <text x="14" y="146" class="dim">● Update session.ts</text>
      <text x="14" y="164"><tspan class="dim">  └ </tspan><tspan class="ok">+48</tspan><tspan class="dim"> </tspan><tspan class="bad">−31</tspan></text>
      <text x="14" y="194" class="fg">&gt; <tspan class="fg">▌</tspan></text>

      <text x="214" y="52" class="resume">resuming codex chat</text>
      <text x="214" y="78" class="codex">› codex</text>
      <text x="214" y="104" class="fg">› add parser tests</text>
      <text x="214" y="128" class="ok">  ✓ 42 passed</text>

      <text x="214" y="227" class="resume">resuming opencode chat</text>
      <text x="214" y="253" class="oc">opencode</text>
      <text x="214" y="279" class="fg">Build · fix flaky</text>
      <text x="214" y="297" class="fg">  CI test</text>
    </g>
    <g class="sans" font-size="11" font-weight="600">
      <rect x="134" y="64" width="56" height="20" rx="10" fill="#238636" fill-opacity="0.25" stroke="#3FB950" stroke-opacity="0.6"/>
      <text x="162" y="78" text-anchor="middle" class="ok">✓ back</text>
      <rect x="314" y="64" width="56" height="20" rx="10" fill="#238636" fill-opacity="0.25" stroke="#3FB950" stroke-opacity="0.6"/>
      <text x="342" y="78" text-anchor="middle" class="ok">✓ back</text>
      <rect x="314" y="239" width="56" height="20" rx="10" fill="#238636" fill-opacity="0.25" stroke="#3FB950" stroke-opacity="0.6"/>
      <text x="342" y="253" text-anchor="middle" class="ok">✓ back</text>
    </g>
  </g>

  <!-- arrows -->
  <g fill="none" stroke="#7D8590" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M420 300 h20 M432 292 l8 8 l-8 8"/>
    <path d="M840 300 h20 M852 292 l8 8 l-8 8"/>
  </g>

  <!-- captions -->
  <g class="sans" font-size="15">
    <circle cx="44" cy="530" r="12" fill="#30363D"/>
    <text x="44" y="535" text-anchor="middle" class="fg" font-weight="700" font-size="13">1</text>
    <text x="66" y="535" class="fg">Your agents are mid-chat</text>

    <circle cx="464" cy="530" r="12" fill="#30363D"/>
    <text x="464" y="535" text-anchor="middle" class="fg" font-weight="700" font-size="13">2</text>
    <text x="486" y="535" class="fg">Rex restarts: every pane is a new shell</text>

    <circle cx="884" cy="530" r="12" fill="#238636"/>
    <text x="884" y="535" text-anchor="middle" class="fg" font-weight="700" font-size="13">3</text>
    <text x="906" y="535" class="fg">Each pane resumes its chat</text>
    <text x="906" y="557" class="dim" font-size="13">with Rex Agent Restore</text>
  </g>
</svg>
