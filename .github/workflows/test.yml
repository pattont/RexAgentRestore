name: test
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash test/unit.sh
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S error bin/rex-agent-restore share/rex-agent-restore/rex-agent-restore.bash test/*.sh
